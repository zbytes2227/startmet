      <path d="M 0,-78 A 90 90 0 0 1 86,-28" stroke="#00DF59" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 0,-112 A 125 125 0 0 1 120,-38" stroke="#00DF59" stroke-width="14" stroke-linecap="round" fill="none" />
      <circle cx="132" cy="-24" r="7" fill="#00DF59" />
      <circle cx="148" cy="-10" r="5" fill="#00DF59" />
    </g>
    <!-- Arm 4: Purple (180 deg) -->
    <g transform="rotate(180)">
      <path d="M 0,-45 A 55 55 0 0 1 52,-18" stroke="#6819F7" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 0,-78 A 90 90 0 0 1 86,-28" stroke="#6819F7" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 0,-112 A 125 125 0 0 1 120,-38" stroke="#6819F7" stroke-width="14" stroke-linecap="round" fill="none" />
      <circle cx="132" cy="-24" r="7" fill="#6819F7" />
      <circle cx="148" cy="-10" r="5" fill="#6819F7" />
    </g>
    <!-- Arm 5: Green (240 deg) -->
    <g transform="rotate(240)">
      <path d="M 0,-45 A 55 55 0 0 1 52,-18" stroke="#00DF59" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 0,-78 A 90 90 0 0 1 86,-28" stroke="#00DF59" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 0,-112 A 125 125 0 0 1 120,-38" stroke="#00DF59" stroke-width="14" stroke-linecap="round" fill="none" />
      <circle cx="132" cy="-24" r="7" fill="#00DF59" />
      <circle cx="148" cy="-10" r="5" fill="#00DF59" />
    </g>
    <!-- Arm 6: Purple (300 deg) -->
    <g transform="rotate(300)">
      <path d="M 0,-45 A 55 55 0 0 1 52,-18" stroke="#6819F7" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 0,-78 A 90 90 0 0 1 86,-28" stroke="#6819F7" stroke-width="14" stroke-linecap="round" fill="none" />
      <path d="M 0,-112 A 125 125 0 0 1 120,-38" stroke="#6819F7" stroke-width="14" stroke-linecap="round" fill="none" />
      <circle cx="132" cy="-24" r="7" fill="#6819F7" />
      <circle cx="148" cy="-10" r="5" fill="#6819F7" />
    </g>
  </g>

  <!-- Typography: STARTMET -->
  <text x="340" y="525" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="4">STARTMET</text>
  
  <!-- TM mark badge -->
  <g transform="translate(535, 475)">
    <circle cx="15" cy="15" r="14" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="15" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">TM</text>
  </g>

  <!-- Tagline: IDEA | DEVELOPMENT | LAUNCH -->
  <text x="350" y="575" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="700" fill="#00DF59" letter-spacing="5">IDEA <tspan fill="#334155">|</tspan> DEVELOPMENT <tspan fill="#334155">|</tspan> LAUNCH</text>
</svg>
